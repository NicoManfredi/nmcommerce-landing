<style>
  :root{--bg:#050505;--red:#ED113C;--white:#F5F5F5;--grey:#9a9a9d;--line:rgba(245,245,245,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--white);font-family:"Hanken Grotesk",sans-serif;min-height:100vh;
    display:grid;place-items:center;text-align:center;padding:30px;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 600px at 50% -10%,rgba(237,17,60,.16),transparent 60%);pointer-events:none}
  .box{position:relative;max-width:520px}
  img{height:34px;margin-bottom:40px}
  .check{width:74px;height:74px;border-radius:50%;border:1.5px solid var(--red);display:grid;place-items:center;
    margin:0 auto 28px;color:var(--red);font-size:34px}
  h1{font-family:"Archivo";font-weight:900;font-size:clamp(32px,7vw,48px);letter-spacing:-.025em;line-height:1.02}
  h1 .red{color:var(--red)}
  p{color:var(--grey);font-size:17px;margin-top:18px;line-height:1.55}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:34px;font-weight:600;font-size:15px;
    padding:14px 26px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;transition:background .2s}
  .btn:hover{background:#ff2e54}
  .label{font-family:"Jost";letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--grey);margin-top:30px}
</style>
